name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not supabase" -q
        env:
          CAREWAVE_STORAGE_BACKEND: memory
          CAREWAVE_UDP_ENABLED: "false"

  deploy:
    needs: test
    if: vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Run deploy script on EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"sudo -iu ubuntu bash /home/ubuntu/CareWave-Motion-State/scripts/deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent,StandardErrorContent]" --output text
          echo "status: $status"
          test "$status" = Success
