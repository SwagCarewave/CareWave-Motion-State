name: Supabase keepalive

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          base="${SUPABASE_URL%/}"
          base="${base%/rest/v1}"
          curl -fsS --retry 3 --retry-delay 10 -o /dev/null \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$base/rest/v1/sessions?select=id&limit=1"
